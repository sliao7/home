<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="80"  x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200"  y1="0" x2="200"  y2="400"/>
    <line x1="400"  y1="0" x2="400"  y2="400"/>
    <line x1="600"  y1="0" x2="600"  y2="400"/>
    <line x1="800"  y1="0" x2="800"  y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Decorative math symbols — left -->
  <text x="40"  y="90"  font-family="Georgia, serif" font-size="52" fill="#6366f1" fill-opacity="0.18">∀</text>
  <text x="100" y="340" font-family="Georgia, serif" font-size="40" fill="#06b6d4" fill-opacity="0.15">∃</text>
  <text x="30"  y="260" font-family="Georgia, serif" font-size="36" fill="#a5b4fc" fill-opacity="0.12">ℕ</text>
  <text x="130" y="160" font-family="Georgia, serif" font-size="30" fill="#67e8f9" fill-opacity="0.12">→</text>

  <!-- Decorative math symbols — right -->
  <text x="1080" y="100" font-family="Georgia, serif" font-size="52" fill="#6366f1" fill-opacity="0.18">λ</text>
  <text x="1110" y="300" font-family="Georgia, serif" font-size="40" fill="#06b6d4" fill-opacity="0.15">ℝ</text>
  <text x="1050" y="220" font-family="Georgia, serif" font-size="36" fill="#a5b4fc" fill-opacity="0.12">⊢</text>
  <text x="1130" y="180" font-family="Georgia, serif" font-size="28" fill="#67e8f9" fill-opacity="0.10">∈</text>

  <!-- Tactic list — left block -->
  <rect x="120" y="140" width="220" height="135" rx="8" fill="#1e293b" fill-opacity="0.7"/>
  <text x="140" y="166" font-family="'Courier New', monospace" font-size="13" fill="#a5b4fc">rfl</text>
  <text x="176" y="166" font-family="'Courier New', monospace" font-size="13" fill="#64748b">  · close goal</text>
  <text x="140" y="187" font-family="'Courier New', monospace" font-size="13" fill="#a5b4fc">rw</text>
  <text x="163" y="187" font-family="'Courier New', monospace" font-size="13" fill="#64748b">   · rewrite</text>
  <text x="140" y="208" font-family="'Courier New', monospace" font-size="13" fill="#a5b4fc">ring</text>
  <text x="176" y="208" font-family="'Courier New', monospace" font-size="13" fill="#64748b"> · algebra</text>
  <text x="140" y="229" font-family="'Courier New', monospace" font-size="13" fill="#a5b4fc">simp</text>
  <text x="176" y="229" font-family="'Courier New', monospace" font-size="13" fill="#64748b"> · simplify</text>
  <text x="140" y="250" font-family="'Courier New', monospace" font-size="13" fill="#a5b4fc">linarith</text>
  <text x="212" y="250" font-family="'Courier New', monospace" font-size="13" fill="#64748b"> · arith</text>

  <!-- Main title — centered -->
  <text x="600" y="195" font-family="Georgia, 'Times New Roman', serif" font-size="54"
        fill="url(#accent)" text-anchor="middle" font-weight="bold">Lean for Mathematics</text>

  <!-- Accent line under title -->
  <rect x="360" y="208" width="480" height="2" rx="1" fill="url(#accent)" opacity="0.6"/>

  <!-- Subtitle -->
  <text x="600" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="22"
        fill="#94a3b8" text-anchor="middle">Personal Notes</text>

  <!-- Bottom label -->
  <text x="600" y="355" font-family="'Courier New', monospace" font-size="14"
        fill="#475569" text-anchor="middle">Lean 4  ·  Mathlib  ·  Formal Mathematics</text>
</svg>
